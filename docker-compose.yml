services:
  gemini-fastapi:
    build:
      context: .
    image: gemini-fastapi:local
    container_name: gemini-fastapi
    env_file:
      - path: .env
        required: false
    environment:
      CONFIG_SERVER__HOST: 0.0.0.0
      CONFIG_SERVER__PORT: 8000
      GEMINI_COOKIE_PATH: /app/cache
    ports:
      - "${HOST_PORT:-8001}:8000"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./cache:/app/cache
      # - ./certs:/app/certs:ro
    restart: on-failure:3
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
